name: Deploy slides to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "projects=$(printf '%s\n' */slides.md | cut -d/ -f1 | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: ${{ matrix.project }}
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          PROJECT: ${{ matrix.project }}
        run: bun run build --base "/${REPO_NAME}/${PROJECT}/" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.project }}
          path: ${{ matrix.project }}/dist
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Assemble dist
        run: |
          mkdir -p dist
          for dir in artifacts/dist-*; do
            name="${dir#artifacts/dist-}"
            mv "$dir" "dist/$name"
          done
          ls -la dist
      - name: Generate index
        run: |
          {
            echo '<!doctype html><head><meta charset="utf-8"><title>Slides</title></head><h1>Slides</h1><ul>'
            for d in dist/*/; do
              name=$(basename "$d")
              echo "<li><a href=\"./${name}/\">${name}</a></li>"
            done
            echo '</ul>'
          } > dist/index.html
      - name: Inject Google Analytics
        env:
          GA_MEASUREMENT_ID: G-EJMPVHNJ0S
        run: |
          shopt -s globstar
          tag="<script async src=\"https://www.googletagmanager.com/gtag/js?id=${GA_MEASUREMENT_ID}\"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','${GA_MEASUREMENT_ID}');</script>"
          sed -i "s#</head>#${tag}</head>#" dist/**/*.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
