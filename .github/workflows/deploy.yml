name: Deploy slides to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: echo "projects=$(printf '%s\n' */slides.md | cut -d/ -f1 | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
  build:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Build
        working-directory: ${{ matrix.project }}
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          PROJECT: ${{ matrix.project }}
        run: bun run build --base "/${REPO_NAME}/${PROJECT}/" --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.project }}
          path: ${{ matrix.project }}/dist
  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Assemble dist
        run: |
          mkdir -p dist
          for dir in artifacts/dist-*; do
            name="${dir#artifacts/dist-}"
            mv "$dir" "dist/$name"
          done
          ls -la dist
      - name: Generate index
        run: |
          {
            cat <<'HTML'
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Slides</title>
          <style>
          :root {
            color-scheme: light dark;
            --bg: #f4f5f7;
            --card: #ffffff;
            --text: #1f2937;
            --muted: #6b7280;
            --border: #e5e7eb;
            --accent: #2f6fec;
            --shadow: 0 1px 2px rgb(15 23 42 / 6%), 0 8px 24px rgb(15 23 42 / 6%);
            --shadow-hover: 0 2px 4px rgb(15 23 42 / 8%), 0 16px 40px rgb(15 23 42 / 14%);
          }
          @media (prefers-color-scheme: dark) {
            :root {
              --bg: #0f1218;
              --card: #181c24;
              --text: #e5e7eb;
              --muted: #9ca3af;
              --border: #2a303b;
              --accent: #7aa7ff;
              --shadow: 0 1px 2px rgb(0 0 0 / 40%);
              --shadow-hover: 0 16px 40px rgb(0 0 0 / 50%);
            }
          }
          * {
            box-sizing: border-box;
          }
          body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", Meiryo, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
          }
          .wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 56px 24px 80px;
          }
          header {
            margin-bottom: 40px;
          }
          h1 {
            margin: 0 0 4px;
            font-size: clamp(2rem, 5vw, 3rem);
            line-height: 1.1;
            letter-spacing: -0.02em;
          }
          header a {
            color: var(--muted);
            text-decoration: none;
          }
          header a:hover {
            color: var(--accent);
          }
          ul {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
            gap: 28px;
            margin: 0;
            padding: 0;
            list-style: none;
          }
          .card {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            color: inherit;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
          }
          .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
          }
          .card:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
          }
          .card img {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #ffffff;
            border-bottom: 1px solid var(--border);
          }
          .card span {
            padding: 16px 20px 20px;
            font-weight: 600;
            line-height: 1.55;
            transition: color 0.2s ease;
          }
          .card:hover span {
            color: var(--accent);
          }
          @media (prefers-reduced-motion: reduce) {
            .card,
            .card span {
              transition: none;
            }
            .card:hover {
              transform: none;
            }
          }
          </style>
          </head>
          <body>
          <div class="wrap">
          <header>
          <h1>Slides</h1>
          <a href="https://github.com/riya-amemiya">Riya Amemiya</a>
          </header>
          <main>
          <ul>
          HTML
            for d in dist/*/; do
              name=$(basename "$d")
              title=$(sed -n 's/.*<meta property="og:title" content="\([^"]*\)".*/\1/p' "${d}index.html")
              title=${title% - Slidev}
              printf '<li><a class="card" href="./%s/"><img src="./%s/og-image.png" alt="" width="980" height="551" loading="lazy"><span>%s</span></a></li>\n' "$name" "$name" "${title:-$name}"
            done
            cat <<'HTML'
          </ul>
          </main>
          </div>
          </body>
          </html>
          HTML
          } > dist/index.html
      - name: Inject Google Analytics
        env:
          GA_MEASUREMENT_ID: G-EJMPVHNJ0S
        run: |
          shopt -s globstar
          tag="<script async src=\"https://www.googletagmanager.com/gtag/js?id=${GA_MEASUREMENT_ID}\"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','${GA_MEASUREMENT_ID}');</script>"
          sed -i "s#</head>#${tag}</head>#" dist/**/*.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
